name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Render 1024x1024 icon from SVG
        run: |
          node -e "try { require('sharp'); } catch (e) { process.exit(3); }" \
            || npm install --no-save sharp@0.34 --no-audit --no-fund
          node -e "require('sharp')('resources/icon.svg').resize(1024, 1024).png().toFile('resources/icon.png').then(() => console.log('icon rendered'))"

      - name: Add iOS platform (SPM)
        run: npx cap add ios --packagemanager SPM

      - name: Generate app icons and splash screens
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#0a0a0a' --splashBackgroundColor '#ffffff'

      - name: Sync web assets and plugins
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          set -o pipefail
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET=(-workspace ios/App/App.xcworkspace)
          else
            TARGET=(-project ios/App/App.xcodeproj)
          fi
          echo "xcodebuild target: ${TARGET[*]}"
          xcodebuild \
            "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Publish build log tail to run summary
        if: failure()
        run: |
          {
            echo '## xcodebuild log (last 300 lines)'
            echo '```'
            tail -n 300 "$RUNNER_TEMP/xcodebuild.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/build/Build/Products" -name "*.app" -maxdepth 3 | head -1)
          echo "Built app: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Cocomusic.ipa Payload
          ls -lh Cocomusic.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cocomusic-iOS-IPA
          path: Cocomusic.ipa
          if-no-files-found: error
